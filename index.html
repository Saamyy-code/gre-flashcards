<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3a8a">
<title>GRE Vocabulary</title>
<style>
:root{--bg:#f3f5f9;--surface:#fff;--text:#0f1b2d;--muted:#667489;--line:#e3e8f0;--brand:#1d3a8a;--brand2:#3b63d6;--soft:#e9eefb;--again:#c8453a;--hard:#c98a1b;--good:#2f8f5b;--easy:#2b78b5;--shadow:0 1px 2px rgba(15,27,45,.06),0 10px 30px rgba(15,27,45,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1118;--surface:#161d27;--text:#e9eef5;--muted:#97a3b3;--line:#262f3b;--brand:#6c93ee;--brand2:#8fb0f5;--soft:#1b2740;--again:#e0695d;--hard:#dfa845;--good:#58bb85;--easy:#62a6d6;--shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(135deg,#1d3a8a,#2f56c4);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 54px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.6px}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.top p{margin:0;font-size:12px;opacity:.8}
.grow{flex:1}
.pill{font-size:12px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:5px 11px;border-radius:99px;white-space:nowrap}
.main{max-width:720px;margin:-36px auto 0;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;gap:18px;margin-bottom:16px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;line-height:1.1}
.ring .t small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.4px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;text-align:center}
.nums b{display:block;font-size:24px;font-weight:700;letter-spacing:-.5px}
.nums span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 2px 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .35s}
.scene{perspective:1400px;cursor:pointer}
.flipper{display:grid;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;min-height:300px}
.scene.flip .flipper{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:44px 24px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.face.back{transform:rotateY(180deg)}
.tag{position:absolute;top:16px;left:18px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tag.r{left:auto;right:18px}
.word{font-size:38px;font-weight:800;letter-spacing:-.8px;word-break:break-word}
.back .word{font-size:26px;color:var(--brand)}
.rule{width:40px;height:3px;border-radius:99px;background:var(--brand2);opacity:.55}
.def{font-size:20px;font-weight:500;max-width:520px}
.ex{font-size:15px;color:var(--muted);font-style:italic;max-width:520px}
.grp{font-size:12px;font-weight:700;color:var(--brand);background:var(--soft);padding:5px 12px;border-radius:99px}
.hint{font-size:13px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;transition:opacity .25s}
.rate.off{opacity:0;pointer-events:none}
.rate button{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:12px 4px 10px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);border-bottom-width:3px}
.rate button:active{transform:scale(.97)}
.rate button span{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.rate .a{border-bottom-color:var(--again)}.rate .h{border-bottom-color:var(--hard)}.rate .g{border-bottom-color:var(--good)}.rate .e{border-bottom-color:var(--easy)}
.keys{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h2{font-size:16px;margin:0 0 4px;font-weight:700}
.panel p.hint{margin:2px 0 8px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
input:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:1px;border-color:transparent}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--brand2)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.d{color:var(--again);border-color:var(--again)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:0}
.item b{display:block}.item span{color:var(--muted);font-size:13px}
.item button{border:0;background:none;color:var(--again);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.msg{font-size:13px;color:var(--good);margin-top:10px;font-weight:600}
.empty{text-align:center;padding:38px 18px}
.empty .big{font-size:20px;font-weight:700;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.navin{display:flex;width:100%;max-width:720px}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:6px 4px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
@media (max-width:480px){.word{font-size:31px}.def{font-size:18px}.hero{padding:14px}.nums b{font-size:21px}}
@media (prefers-reduced-motion:reduce){.flipper{transition:none}}
</style>
</head>
<body>
<div class="top"><div class="top-in"><div class="logo">GRE</div><div><h1>GRE Vocabulary</h1><p>Spaced-repetition flashcards</p></div><div class="grow"></div><div class="pill" id="streak"></div></div></div>
<div class="main"><div id="view"></div></div>
<nav><div class="navin" id="nav"></div></nav>
<script>
// Starter deck: word | definition | example | synonym group. Add your own in the app or edit this list.
var SEED = [
"abate|to become less intense|The storm abated by morning.|decrease",
"abstruse|hard to understand|The professor's abstruse theory confused the class.|obscure",
"aberrant|departing from the normal|His aberrant behavior worried colleagues.|abnormal",
"acumen|keen insight in a field|Her business acumen saved the firm.|insight",
"admonish|to warn or reprimand gently|The coach admonished him for being late.|criticize",
"aesthetic|relating to beauty|The aesthetic appeal of the design won praise.|beauty",
"alacrity|cheerful eagerness|She accepted the job with alacrity.|eagerness",
"ambivalent|having mixed feelings|He was ambivalent about moving abroad.|uncertain",
"ameliorate|to make better|Reforms ameliorated working conditions.|improve",
"anomaly|something that deviates from the norm|The result was an anomaly in the data.|abnormal",
"apathy|lack of interest or concern|Voter apathy kept turnout low.|indifference",
"arduous|very difficult, requiring effort|The arduous climb took six hours.|difficult",
"articulate|to express clearly|She articulated her objections well.|express",
"ascetic|living with strict self-denial|He led an ascetic life in the hills.|austere",
"audacious|boldly daring|An audacious plan to cross the desert.|bold",
"austere|severe, plain, without luxury|The monastery had an austere interior.|austere",
"banal|lacking originality, trite|The film's banal dialogue bored critics.|trite",
"belie|to give a false impression of|His calm tone belied his anxiety.|contradict",
"benevolent|kind and well-meaning|A benevolent donor funded the clinic.|kind",
"bolster|to support or strengthen|New evidence bolstered her claim.|support",
"bombastic|pompous, overblown in speech|The senator's bombastic speech irritated listeners.|pompous",
"capricious|unpredictable, changing suddenly|Capricious weather ruined the picnic.|fickle",
"candid|frank and honest|A candid review of the product.|frank",
"censure|strong official criticism|The board issued a censure.|criticize",
"circumspect|careful, cautious about risks|Be circumspect when signing contracts.|cautious",
"coalesce|to come together into one|Separate groups coalesced into a movement.|merge",
"cogent|clear, logical and convincing|A cogent argument for reform.|convincing",
"complacent|smugly self-satisfied|The champion grew complacent.|smug",
"conundrum|a confusing problem or question|The budget gap is a real conundrum.|puzzle",
"corroborate|to confirm with evidence|Witnesses corroborated her story.|confirm",
"credulous|too ready to believe|Credulous buyers fell for the scam.|gullible",
"cursory|hasty, not thorough|A cursory glance at the report.|superficial",
"daunting|intimidating|A daunting task lay ahead.|intimidating",
"debunk|to expose as false|Scientists debunked the myth.|refute",
"deference|respectful submission|He showed deference to his elders.|respect",
"delineate|to describe or outline precisely|The contract delineates each duty.|describe",
"denigrate|to criticize unfairly|Do not denigrate your rivals.|belittle",
"desultory|lacking a plan, half-hearted|A desultory conversation.|aimless",
"diatribe|a bitter verbal attack|He launched into a diatribe against the policy.|tirade",
"diffident|shy, lacking self-confidence|A diffident speaker.|shy",
"dilettante|a person with superficial interest|A dilettante in painting.|amateur",
"disparate|essentially different, unrelated|Disparate groups joined the cause.|different",
"dogmatic|asserting opinions as fact|A dogmatic approach to teaching.|rigid",
"eclectic|drawn from many sources|An eclectic music collection.|varied",
"efficacy|ability to produce a desired result|The efficacy of the drug was proven.|effectiveness",
"enigmatic|mysterious, hard to interpret|Her enigmatic smile puzzled him.|mysterious",
"ephemeral|lasting a very short time|Fame can be ephemeral.|fleeting",
"equivocal|open to more than one interpretation|An equivocal answer.|ambiguous",
"esoteric|understood by only a few|Esoteric knowledge of ancient texts.|obscure",
"exacerbate|to make worse|Stress exacerbated his illness.|worsen",
"fastidious|very attentive to detail|A fastidious editor.|meticulous",
"fervent|passionate, intense|A fervent supporter of the team.|passionate",
"flout|to openly disregard a rule|Drivers flouted the speed limit.|defy",
"garrulous|excessively talkative|A garrulous neighbor.|talkative",
"gregarious|sociable, enjoying company|A gregarious host.|sociable",
"hackneyed|overused, unoriginal|A hackneyed plot.|trite",
"harbinger|a sign of what is to come|Crocuses are a harbinger of spring.|omen",
"iconoclast|one who attacks cherished beliefs|The iconoclast mocked tradition.|rebel",
"idiosyncratic|peculiar to an individual|His idiosyncratic style of teaching.|peculiar",
"inchoate|just begun, not fully formed|An inchoate idea.|rudimentary",
"insipid|lacking flavor or interest|An insipid speech.|dull",
"laconic|using very few words|A laconic reply.|concise",
"lucid|clearly expressed|A lucid explanation.|clear",
"magnanimous|generous toward a rival|A magnanimous victor.|generous",
"mitigate|to make less severe|Trees mitigate noise.|lessen",
"mundane|ordinary, everyday|A mundane routine.|ordinary",
"obdurate|stubbornly refusing to change|An obdurate negotiator.|stubborn",
"obsequious|excessively eager to please|An obsequious assistant.|servile",
"ostentatious|showy, designed to impress|An ostentatious mansion.|showy",
"paucity|a small amount, scarcity|A paucity of evidence.|scarcity",
"pernicious|harmful in a gradual way|A pernicious influence.|harmful",
"pragmatic|practical rather than idealistic|A pragmatic solution.|practical",
"prodigal|wastefully extravagant|A prodigal spender.|wasteful",
"quixotic|idealistic but impractical|A quixotic quest.|impractical",
"recalcitrant|stubbornly resistant to authority|A recalcitrant student.|stubborn",
"replete|filled or well supplied|The essay is replete with examples.|full",
"sanguine|optimistic, hopeful|A sanguine outlook.|optimistic",
"spurious|false, not genuine|A spurious claim.|false",
"substantiate|to provide evidence for|Substantiate your claim.|prove",
"tenuous|weak or slight|A tenuous connection.|weak",
"trenchant|sharp, forceful in expression|A trenchant critique.|incisive",
"truncate|to shorten by cutting|The report was truncated.|shorten",
"ubiquitous|present everywhere|Smartphones are ubiquitous.|widespread",
"venerate|to regard with great respect|They venerate their ancestors.|revere",
"verbose|using more words than needed|A verbose email.|wordy",
"vindicate|to clear of blame|The evidence vindicated him.|exonerate",
"volatile|liable to change rapidly|A volatile market.|unstable",
"zealous|filled with energy for a cause|A zealous campaigner.|passionate"
];

var KEY="gre_cards_v1", SKEY="gre_settings_v1";
var cards=[], settings={newPerDay:30,date:"",newToday:0,streak:0,last:""}, view="study", queue=[], flipped=false, msg="", sessionTotal=0, sessionDone=0;

function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fetchStore(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function dayStr(offset){var d=new Date();d.setDate(d.getDate()+(offset||0));return d.toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function mk(w,d,e,g){return {id:uid(),w:w,d:d,e:e||"",g:g||"",ease:2.5,ivl:0,due:0,reps:0,seen:false}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function save(){store(KEY,cards);store(SKEY,settings)}
function seedDeck(){return SEED.map(function(l){var p=l.split("|");return mk(p[0],p[1],p[2],p[3])})}

function init(){
  var c=fetchStore(KEY), s=fetchStore(SKEY);
  if(s){for(var k in s)settings[k]=s[k]}
  if(settings.date!==dayStr(0)){settings.date=dayStr(0);settings.newToday=0}
  cards=(c&&c.length)?c:seedDeck();
  save();buildQueue();render();
}

function buildQueue(){
  var now=Date.now();
  var due=cards.filter(function(c){return c.seen&&c.due<=now}).sort(function(a,b){return a.due-b.due});
  var room=Math.max(0,settings.newPerDay-settings.newToday);
  var fresh=cards.filter(function(c){return !c.seen}).slice(0,room);
  queue=due.concat(fresh).map(function(c){return c.id});
  flipped=false;sessionTotal=queue.length;sessionDone=0;
}
function byId(id){return cards.filter(function(c){return c.id===id})[0]}

function touchStreak(){
  if(settings.last===dayStr(0))return;
  settings.streak=(settings.last===dayStr(-1))?(settings.streak||0)+1:1;
  settings.last=dayStr(0);
}

function rate(q){
  var c=byId(queue[0]); if(!c)return;
  if(!c.seen){c.seen=true;settings.newToday++}
  touchStreak();
  if(q===0){
    c.ease=Math.max(1.3,c.ease-0.2);c.ivl=0;c.due=Date.now()+10*60000;
    queue.push(queue.shift());
  }else{
    c.reps++;
    if(c.reps===1){c.ivl=q===3?4:1}
    else{
      var f=q===1?1.2:(q===2?c.ease:c.ease*1.3);
      c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*f));
    }
    if(q===1)c.ease=Math.max(1.3,c.ease-0.15);
    if(q===3)c.ease+=0.15;
    c.due=Date.now()+c.ivl*86400000;
    queue.shift();sessionDone++;
  }
  flipped=false;save();render();
}

function label(days){return days<1?"10 min":(days===1?"1 day":days+" days")}
function preview(c,q){
  if(q===0)return "10 min";
  var reps=c.reps+1,ivl;
  if(reps===1){ivl=q===3?4:1}
  else{var f=q===1?1.2:(q===2?c.ease:c.ease*1.3);ivl=Math.max(c.ivl+1,Math.round(c.ivl*f))}
  return label(ivl);
}

function counts(){
  var now=Date.now();
  var due=cards.filter(function(c){return c.seen&&c.due<=now}).length;
  var fresh=Math.min(cards.filter(function(c){return !c.seen}).length,Math.max(0,settings.newPerDay-settings.newToday));
  var learned=cards.filter(function(c){return c.reps>0}).length;
  return {due:due,fresh:fresh,total:cards.length,learned:learned};
}

function parseCSV(text){
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===','||ch==='\t'){row.push(cur);cur=""}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur="";if(row.join("").trim())rows.push(row);row=[]}
    else cur+=ch;
  }
  row.push(cur);if(row.join("").trim())rows.push(row);
  return rows;
}
function csvCell(s){s=String(s==null?"":s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function download(name,text,type){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function importRows(rows){
  var n=0;
  rows.forEach(function(r,i){
    if(i===0&&/^word$/i.test((r[0]||"").trim()))return;
    if(!r[0]||!r[0].trim()||!r[1]||!r[1].trim())return;
    cards.push(mk(r[0].trim(),r[1].trim(),(r[2]||"").trim(),(r[3]||"").trim()));n++;
  });
  save();buildQueue();return n;
}

var ICONS={
 study:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
 add:'<path d="M12 5v14M5 12h14"/>',
 cards:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 data:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'
};

function render(){
  var nav=document.getElementById("nav");
  var tabs=[["study","Study"],["add","Add"],["cards","Cards"],["data","Settings"]];
  nav.innerHTML=tabs.map(function(t){return '<button data-v="'+t[0]+'" class="'+(view===t[0]?"on":"")+'"><svg viewBox="0 0 24 24">'+ICONS[t[0]]+'</svg>'+t[1]+'</button>'}).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("button"),function(b){
    b.onclick=function(){view=b.getAttribute("data-v");msg="";if(view==="study")buildQueue();render();window.scrollTo(0,0)};
  });
  var st=settings.streak||0;
  document.getElementById("streak").textContent=st>0?("Streak: "+st+(st===1?" day":" days")):"Start your streak";
  var v=document.getElementById("view");
  if(view==="study")renderStudy(v);
  else if(view==="add")renderAdd(v);
  else if(view==="cards")renderCards(v,"");
  else renderData(v);
}

function flip(){
  if(flipped||!byId(queue[0]))return;
  flipped=true;
  var s=document.getElementById("scene"),r=document.getElementById("rate");
  if(s)s.classList.add("flip");
  if(r)r.classList.remove("off");
}

function renderStudy(v){
  var k=counts();
  var pctLearned=k.total?k.learned/k.total:0, C=2*Math.PI*32;
  var html='<div class="hero"><div class="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="38" cy="38" r="32" fill="none" stroke="var(--brand2)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(pctLearned*C).toFixed(1)+' '+C.toFixed(1)+'"/></svg><div class="t">'+Math.round(pctLearned*100)+'%<small>LEARNED</small></div></div>'
   +'<div class="nums"><div><b>'+k.due+'</b><span>Due</span></div><div><b>'+k.fresh+'</b><span>New</span></div><div><b>'+k.total+'</b><span>Total</span></div></div></div>';
  var c=byId(queue[0]);
  if(!c){
    html+='<div class="panel empty"><div class="big">All done for now</div><p class="hint">No cards are due. Add more words, raise the daily new-card limit in Settings, or come back later.</p></div>';
    v.innerHTML=html;return;
  }
  var pct=sessionTotal?Math.round(sessionDone/sessionTotal*100):0;
  html+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
  html+='<div class="scene" id="scene"><div class="flipper">'
   +'<div class="face front"><span class="tag">Word</span><span class="tag r">'+(sessionDone+1)+' of '+sessionTotal+'</span><div class="word">'+esc(c.w)+'</div><div class="hint">Tap to reveal the meaning</div></div>'
   +'<div class="face back"><span class="tag">Meaning</span><span class="tag r">'+(sessionDone+1)+' of '+sessionTotal+'</span><div class="word">'+esc(c.w)+'</div><div class="rule"></div><div class="def">'+esc(c.d)+'</div>'
   +(c.e?'<div class="ex">'+esc(c.e)+'</div>':'')+(c.g?'<div class="grp">'+esc(c.g)+'</div>':'')+'</div>'
   +'</div></div>';
  html+='<div class="rate off" id="rate">'
   +'<button class="a" data-q="0">Again<span>'+preview(c,0)+'</span></button>'
   +'<button class="h" data-q="1">Hard<span>'+preview(c,1)+'</span></button>'
   +'<button class="g" data-q="2">Good<span>'+preview(c,2)+'</span></button>'
   +'<button class="e" data-q="3">Easy<span>'+preview(c,3)+'</span></button></div>';
  html+='<div class="keys">Keyboard: Space to flip, 1-4 to rate</div>';
  v.innerHTML=html;
  document.getElementById("scene").onclick=flip;
  Array.prototype.forEach.call(v.querySelectorAll(".rate button"),function(b){
    b.onclick=function(){rate(parseInt(b.getAttribute("data-q"),10))};
  });
}

function renderAdd(v){
  v.innerHTML='<div class="panel"><h2>Add a card</h2>'
   +'<label>Word</label><input id="fw" autocomplete="off">'
   +'<label>Meaning</label><input id="fd" autocomplete="off">'
   +'<label>Example sentence (optional)</label><input id="fe" autocomplete="off">'
   +'<label>Synonym group (optional)</label><input id="fg" autocomplete="off">'
   +'<div class="row"><button class="btn p" id="addbtn">Add card</button></div>'
   +'<div class="msg">'+esc(msg)+'</div></div>';
  document.getElementById("addbtn").onclick=function(){
    var w=document.getElementById("fw").value.trim(),d=document.getElementById("fd").value.trim();
    if(!w||!d){msg="Word and meaning are required.";render();return}
    cards.push(mk(w,d,document.getElementById("fe").value.trim(),document.getElementById("fg").value.trim()));
    save();msg="Added: "+w;render();
  };
}

function renderCards(v,q){
  var list=cards.filter(function(c){return !q||c.w.toLowerCase().indexOf(q.toLowerCase())>-1||c.d.toLowerCase().indexOf(q.toLowerCase())>-1});
  var html='<div class="panel"><input id="search" placeholder="Search words or meanings" value="'+esc(q)+'">'
   +'<p class="hint" style="margin-top:10px">'+list.length+' cards</p>';
  list.slice(0,200).forEach(function(c){
    html+='<div class="item"><div><b>'+esc(c.w)+'</b><span>'+esc(c.d)+'</span></div><button data-id="'+c.id+'">Delete</button></div>';
  });
  if(list.length>200)html+='<p class="hint">Showing the first 200. Search to narrow down.</p>';
  html+='</div>';
  v.innerHTML=html;
  var s=document.getElementById("search");
  s.oninput=function(){var pos=s.value;renderCards(v,pos);var n=document.getElementById("search");n.focus();n.setSelectionRange(pos.length,pos.length)};
  Array.prototype.forEach.call(v.querySelectorAll(".item button"),function(b){
    b.onclick=function(){var id=b.getAttribute("data-id");cards=cards.filter(function(c){return c.id!==id});save();buildQueue();renderCards(v,q)};
  });
}

function renderData(v){
  v.innerHTML='<div class="panel"><h2>Import cards (CSV)</h2>'
   +'<p class="hint">Columns: word, meaning, example, group. A header row is optional. Paste rows or choose a file.</p>'
   +'<textarea id="paste" placeholder="abate,to become less intense,The storm abated.,decrease"></textarea>'
   +'<div class="row"><button class="btn p" id="imp">Import pasted rows</button>'
   +'<input type="file" id="file" accept=".csv,.txt" style="width:auto"></div>'
   +'<div class="msg">'+esc(msg)+'</div></div>'
   +'<div class="panel"><h2>Daily goal</h2><label>New cards per day</label>'
   +'<input id="npd" type="number" min="0" max="200" value="'+settings.newPerDay+'">'
   +'<div class="row"><button class="btn" id="setbtn">Save</button></div></div>'
   +'<div class="panel"><h2>Backup</h2>'
   +'<p class="hint">Progress is stored in this browser only. Export a backup now and then, and import it on another device.</p>'
   +'<div class="row"><button class="btn" id="expcsv">Export cards (CSV)</button><button class="btn" id="expjson">Export progress (JSON)</button></div>'
   +'<label>Restore progress from a JSON backup</label><input type="file" id="jfile" accept=".json">'
   +'<div class="row"><button class="btn d" id="reset">Reset to the starter deck</button></div></div>';
  document.getElementById("imp").onclick=function(){
    var n=importRows(parseCSV(document.getElementById("paste").value));
    msg="Imported "+n+" cards.";render();
  };
  document.getElementById("file").onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){var n=importRows(parseCSV(String(r.result)));msg="Imported "+n+" cards.";render()};r.readAsText(f);
  };
  document.getElementById("setbtn").onclick=function(){
    settings.newPerDay=Math.max(0,parseInt(document.getElementById("npd").value,10)||0);save();msg="Saved.";render();
  };
  document.getElementById("expcsv").onclick=function(){
    var out="word,meaning,example,group\n"+cards.map(function(c){return [c.w,c.d,c.e,c.g].map(csvCell).join(",")}).join("\n");
    download("gre-cards.csv",out,"text/csv");
  };
  document.getElementById("expjson").onclick=function(){
    download("gre-progress.json",JSON.stringify({cards:cards,settings:settings}),"application/json");
  };
  document.getElementById("jfile").onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){
      try{var o=JSON.parse(String(r.result));if(o.cards&&o.cards.length){cards=o.cards;if(o.settings){for(var k in o.settings)settings[k]=o.settings[k]}save();buildQueue();msg="Backup restored.";render()}else{msg="That file has no cards.";render()}}
      catch(err){msg="Could not read that file.";render()}
    };r.readAsText(f);
  };
  document.getElementById("reset").onclick=function(){
    if(confirm("This deletes all your cards and progress. Continue?")){
      cards=seedDeck();settings.newToday=0;settings.streak=0;settings.last="";save();buildQueue();msg="Reset done.";render();
    }
  };
}

document.addEventListener("keydown",function(e){
  if(view!=="study"||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.code==="Space"){e.preventDefault();flip()}
  else if(flipped&&e.key&&"1234".indexOf(e.key)>-1){rate(parseInt(e.key,10)-1)}
});
init();
</script>
</body>
</html>
